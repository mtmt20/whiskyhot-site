": "조니워커 블루라벨", "store": "트레이더스", "branch": "대구", "price": 259800, "off": null, "checked": "2026-09-06", "href": "/whisky/johnnie-walker-blue-label.html"}, {"name": "발렌타인 17년", "store": "코스트코", "branch": "고척", "price": 118900, "off": null, "checked": "2026-09-06", "href": "/whisky/ballantine-s-17-year-old.html"}];

  // 선택한 매장의 인증 시세만 남겨서 다시 그린다 (매장 칩은 사용자 글과 이 목록을 동시에 좁힌다)
  function renderFeed() {

    if (!rows.length) {
      els.feed.innerHTML = '<p class="board-feed-empty">' +

  // 디시인사이드류 게시판 - 공지는 항상 위, 그 아래는 특가/자유 안 나누고 하나의 표로 쭉 이어짐
  // (매장 필터를 고르면 특가글만 그 매장 것으로 좁혀짐, 자유글/공지는 필터와 무관하게 항상 보임)
  // 시세판: 날짜별로 묶은 장부. 특가글은 "[매장 지점] 위스키 가격" 제목에서 매장과 위스키를
  // 갈라 보여주고, 공지·자유글은 제목 그대로. 표(번호/제목/글쓴이/날짜/인증)는 2026-09-23에 뺐다
  var DAYS = ["일", "월", "화", "수", "목", "금", "토"];
  function dayKey(s) { return (s || "").slice(0, 10); }
  function dayLabel(key) {
    var d = new Date(key + "T00:00:00");
    if (isNaN(d)) return key;
    return (d.getMonth() + 1) + "월 " + d.getDate() + "일";
  }
  function dayName(key) { var d = new Date(key + "T00:00:00"); return isNaN(d) ? "" : DAYS[d.getDay()] + "요일"; }
  function timeOf(s) { return (s || "").slice(11, 16); }
  function splitTitle(p) {
    var m = /^\s*\[([^\]]+)\]\s*(.*?)\s*([0-9][0-9,]*원)?\s*$/.exec(p.title || "");
    if (p.category === "deal" && m) return { where: m[1], name: m[2] || p.title };
    return { where: p.store_channel || "", name: p.title || "" };
  }
  function renderTable() {

  }

  // 1주일 넘게 아무도 "아직 맞아요"를 안 눌러 취소선이 그어진 글들.

  els.verifyAsk.addEventListener("click", function(e) {

      renderVerifyAsk();

  // 매장 필터 칩 - 서버 재조회 없이 이미 받아둔 목록을 클라이언트에서 다시 그림(특가글만 좁혀짐)

  fetch("https://api.whiskyhot.com/auth/me", { credentials: "include" }).then(function(r) { return r.json(); }).then(function(data) {
    if (data.logged_in && data.preferred_store) {

  els.memoToggle.addEventListener("click", function() {

    if (!els.bodyInput.hidden) els.bodyInput.focus();

  els.submitBtn.addEventListener("click", function() {
    var typed = els.titleInput.value.trim();
    var memo = els.bodyInput.value.trim();
    var payload = { category: state.category };
    if (state.category === "deal") {

      var branch = els.branchInput.value.trim();

      payload.price = price;

        + (memo ? "\n\n" + memo : "");

      payload.body = memo;

      method: "POST", credentials: "include",
      headers: { "Content-Type": "application/json" },

    }).then(function(r) {
      if (r.status === 401) {
        // 로그인 전에 쓴 내용을 버리지 않는다 - 로그인하고 돌아오면 그대로 채워져 있고 등록만 누르면 된다
        try {
          localStorage.setItem("board_draft", JSON.stringify({
            store: els.storeSelect.value, branch: els.branchInput.value, title: els.titleInput.value,
            price: els.priceInput.value, body: els.bodyInput.value
          }));
        } catch (e) {}
        alert("로그인 후에 등록 버튼만 다시 누르면 돼요. 쓰신 내용은 남겨둘게요 (우측 상단 로그인)");
        return null;
      }
      return r.json();
    }).then(function(data) {
      if (!data) return;
      if (data.error) { alert(data.error); return; }
      els.titleInput.value = ""; els.bodyInput.value = ""; els.priceInput.value = "";
      els.branchInput.value = "";
      try { localStorage.removeItem("board_draft"); } catch (e) {}
      alert("올라갔어요. 다음 갱신 때 그 위스키 페이지와 매장 시세에도 실려요.");
      loadLists();
    }).catch(function() {});
  });

  function renderDetail(post) {
    var commentsHtml = post.comments.map(function(c) {
      return (
        '<div class="board-comment-row' + (c.is_verification ? ' is-verification' : '') + '">' +
          (c.is_verification ? '✅ ' : '') + esc(c.body) +
          '<div class="board-comment-meta">' + esc(c.nickname) + ' · ' + esc(c.created_at) + '</div>' +
        '</div>'
      );
    }).join("") || '<p class="board-empty">아직 댓글이 없어요.</p>';
    var priceLine = post.price ? '<p class="board-post-price">' + fmtPrice(post.price) + '</p>' : "";
    var storeLine = post.store_channel ? '<p class="board-post-store">' + esc(post.store_channel) + '</p>' : "";
    els.detailBox.innerHTML =
      '<button class="board-detail-close" id="board-detail-close">×</button>' +
      storeLine +
      '<h2>' + esc(post.title) + '</h2>' +
      priceLine +
      '<p style="white-space:pre-wrap;">' + esc(post.body) + '</p>' +
      '<p class="board-post-meta">' + esc(post.nickname) + ' · 인증 ' + post.verify_count + '회 · ' + esc(post.created_at) + '</p>' +
      '<hr style="border-color:var(--rule);" />' +
      commentsHtml +
      '<div class="board-comment-form">' +
        '<textarea id="board-comment-input" class="wf-input" placeholder="댓글을 남겨보세요"></textarea>' +
        (post.category === "deal"
          ? '<label class="board-verify-row"><input type="checkbox" id="board-verify-check" /> 아직 이 가격/정보가 맞아요 (재인증)</label>'
          : "") +
        '<button class="cta" id="board-comment-submit">댓글 등록</button>' +
      '</div>' +
      '<button type="button" class="share-btn" id="board-share-btn" style="width:100%;margin-top:10px;">이 글 공유용 복사</button>';
    document.getElementById("board-detail-close").addEventListener("click", function() { els.detailOverlay.hidden = true; });
    // 올린 사람이 자기 커뮤니티에 자랑할 수 있게 - 제목 + 이 글 주소를 복사한다
    document.getElementById("board-share-btn").addEventListener("click", function() {
      var btn = this;
      var text = post.title + " - " + location.origin + "/board.html?post=" + post.id;
      var done = function() { btn.textContent = "복사됐어요"; setTimeout(function() { btn.textContent = "이 글 공유용 복사"; }, 1800); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(function() { window.prompt("복사해서 쓰세요", text); });
      } else {
        window.prompt("복사해서 쓰세요", text);
      }
    });
    document.getElementById("board-comment-submit").addEventListener("click", function() {
      var body = document.getElementById("board-comment-input").value.trim();
      if (!body) return;
      var verify = post.category === "deal" && document.getElementById("board-verify-check").checked;
      fetch("https://api.whiskyhot.com/auth/board/posts/" + post.id + "/comments", {
        method: "POST", credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ body: body, verify: verify }),
      }).then(function(r) {
        if (r.status === 401) { alert("댓글을 쓰려면 먼저 로그인해주세요 (우측 상단 로그인 버튼)"); return null; }
        return r.json();
      }).then(function(data) {
        if (!data) return;
        openPost(post.id);
        loadLists();
      }).catch(function() {});
    });
  }

  function openPost(id) {
    fetch("https://api.whiskyhot.com/auth/board/posts/" + id, { credentials: "include" }).then(function(r) { return r.json(); }).then(function(post) {
      if (post.error) return;
      renderDetail(post);
      els.detailOverlay.hidden = false;
    }).catch(function() {});
  }

  els.postList.addEventListener("click", function(e) {
    var inline = e.target.closest("[data-verify-inline]");
    if (inline) {
      // 목록에서 바로 "아직 맞아요" - 상단 재인증 줄과 같은 요청
      e.preventDefault();
      e.stopPropagation();
      var id = inline.dataset.verifyInline;
      inline.textContent = "보내는 중";
      fetch("https://api.whiskyhot.com/auth/board/posts/" + id + "/comments", {
        method: "POST", credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ body: "아직 이 값 맞아요", verify: true }),
      }).then(function(r) {
        if (r.status === 401) { alert("확인을 남기려면 먼저 로그인해주세요 (우측 상단 로그인)"); inline.textContent = "아직 맞아요"; return null; }
        return r.json();
      }).then(function(d) { if (d) loadLists(); }).catch(function() { inline.textContent = "아직 맞아요"; });
      return;
    }
    var row = e.target.closest(".board-row");
    if (row) { e.preventDefault(); openPost(row.dataset.id); }
  });

  // 로그인 전에 쓰다 만 글 복원 (위 401 처리 참고)
  try {
    var draft = JSON.parse(localStorage.getItem("board_draft") || "null");
    if (draft && draft.title) {
      els.writeForm.hidden = false;
      els.storeSelect.value = draft.store || "";
      els.branchInput.value = draft.branch || "";
      els.titleInput.value = draft.title || "";
      els.priceInput.value = draft.price || "";
      els.bodyInput.value = draft.body || "";
      els.formHint.textContent = "아까 쓰던 글이 남아 있어요. 로그인했다면 등록만 누르면 돼요.";
    }
  } catch (e) {}

  // 상세페이지·매장 시세에서 "게시판 글 보기"로 들어오면 그 글을 바로 연다 (/board.html?post=ID)
  var wantedPost = new URLSearchParams(location.search).get("post");
  if (wantedPost && /^[0-9]+$/.test(wantedPost)) openPost(wantedPost);
})();
</script>
  <script>
(function() {
  if (document.getElementById("fb-fab")) return;
  var page = location.pathname || "/";
  var API = "https://api.whiskyhot.com/api/feedback";
  var fab = document.createElement("button");
  fab.id = "fb-fab"; fab.className = "fb-fab"; fab.type = "button"; fab.setAttribute("aria-label", "의견 보내기");
  fab.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" style="vertical-align:-2px;"><path d="M4 5H20C20.55 5 21 5.45 21 6V15C21 15.55 20.55 16 20 16H9L5 19.5V16H4C3.45 16 3 15.55 3 15V6C3 5.45 3.45 5 4 5Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><span>의견</span>';
  var panel = document.createElement("div");
  panel.id = "fb-panel"; panel.className = "fb-panel"; panel.hidden = true;
  panel.innerHTML =
    '<div class="fb-head"><strong>이 페이지, 어땠어요?</strong><button type="button" class="fb-close" aria-label="닫기">&times;</button></div>' +
    '<div class="fb-votes"><button type="button" class="fb-vote" data-v="up">도움됐어요</button><button type="button" class="fb-vote" data-v="down">아쉬워요</button></div>' +
    '<textarea class="fb-text" maxlength="500" placeholder="어떤 정보가 더 있었으면 좋겠어요? 틀린 가격이나 이름이 있나요? (선택)"></textarea>' +
    '<input class="fb-contact" maxlength="80" placeholder="답장 받을 연락처 (선택 · 이메일/카톡ID)" />' +
    '<button type="button" class="cta fb-submit">보내기</button>' +
    '<p class="fb-done" hidden>고마워요! 하나하나 다 읽고 반영할게요.</p>' +
    '<p class="fb-err" hidden>지금은 보낼 수 없어요. 잠시 후 다시 시도해주세요.</p>';
  document.body.appendChild(fab);
  document.body.appendChild(panel);

  var vote = "";
  fab.addEventListener("click", function() { panel.hidden = !panel.hidden; });
  panel.querySelector(".fb-close").addEventListener("click", function() { panel.hidden = true; });
  Array.prototype.forEach.call(panel.querySelectorAll(".fb-vote"), function(btn) {
    btn.addEventListener("click", function() {
      vote = btn.getAttribute("data-v");
      Array.prototype.forEach.call(panel.querySelectorAll(".fb-vote"), function(b) { b.classList.toggle("selected", b === btn); });
    });
  });
  panel.querySelector(".fb-submit").addEventListener("click", function() {
    var message = panel.querySelector(".fb-text").value.trim();
    var contact = panel.querySelector(".fb-contact").value.trim();
    var err = panel.querySelector(".fb-err");
    err.hidden = true;
    if (!vote && !message) { err.textContent = "도움됐어요/아쉬워요 중 하나를 고르거나 의견을 적어주세요."; err.hidden = false; return; }
    fetch(API, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ page: page, vote: vote, message: message, contact: contact })
    }).then(function(r) {
      if (!r.ok) throw new Error("bad status");
      panel.querySelector(".fb-done").hidden = false;
      panel.querySelector(".fb-submit").disabled = true;
      setTimeout(function() { panel.hidden = true; }, 1800);
    }).catch(function() {
      err.textContent = "지금은 보낼 수 없어요. 잠시 후 다시 시도해주세요."; err.hidden = false;
    });
  });
})();
</script>
