<!doctype html><html lang="zh"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600&family=Noto+Sans+SC:wght@400;500&family=Cormorant+Garamond:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css"></head>
<body><div class="card" style="background:var(--charcoal); color:var(--cream)">
  <div class="ai-label" style="color:rgba(245,240,232,.6)">{{ai_label}}</div>
  <div class="eyebrow">Next</div>
  <div class="h1" style="margin-top:30px; color:var(--cream)">想去哪一家？<br><span style="color:var(--sage)">评论区告诉我</span></div>
  <div class="body" style="margin-top:48px; color:rgba(245,240,232,.75)">{{outro_zh}}</div>
  <div class="grow"></div>
  <div class="body" style="color:rgba(245,240,232,.75)">关注 · 收藏 · 下次来首尔直接用</div>
  <div style="height:24px"></div>
  <div style="display:flex; gap:14px; flex-wrap:wrap">{{tag_chips}}</div>
  <div class="foot"><div class="brand-zh" style="color:var(--cream)">{{brand_zh}}</div><div class="brand" style="color:var(--sage)">{{brand_en}}</div></div>
</div></body></html>
