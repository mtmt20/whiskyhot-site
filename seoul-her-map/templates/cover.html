<!doctype html><html lang="zh"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600&family=Noto+Sans+SC:wght@400;500&family=Cormorant+Garamond:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css"></head>
<body><div class="card">
  <div class="ai-label">{{ai_label}}</div>
  <div class="eyebrow">{{area_en}} · Seoul · {{date_short}}</div>
  <div style="height:32px"></div>
  <div class="h1">{{signature}}<br><span class="mark">{{area_zh}}{{category_zh}}</span><span style="color:var(--sage)"> {{count}}{{unit_zh}}</span></div>
  <div style="height:36px"></div>
  <div class="hook">{{hook_zh}}</div>
  <div style="height:48px"></div>
  <div class="collage" style="height:720px; position:relative">
    <div class="photo {{cover_image_ph}}" style="background-image:url('{{cover_image}}')"></div>
    <div class="photo {{cover_image_2_ph}}" style="background-image:url('{{cover_image_2}}')"></div>
    <div class="photo {{cover_image_3_ph}}" style="background-image:url('{{cover_image_3}}')"></div>
    <div class="sticker dark" style="left:-14px; top:-22px">{{sticker_zh}}</div>
    <div class="sticker" style="right:-10px; bottom:-18px; transform:rotate(3deg)">人均 {{avg_price_zh}}</div>
  </div>
  <div style="height:40px"></div>
  <div class="small">{{vibe_line}}</div>
  <div class="grow"></div>
  <div class="foot">
    <div><div class="brand-zh">{{brand_zh}}</div><div class="brand">{{brand_en}}</div></div>
    <div class="chip soft" style="margin:0">收藏 ↓ 到了直接用</div>
  </div>
  <img class="mascot" src="{{mascot}}" onerror="this.style.display='none'">
</div></body></html>
