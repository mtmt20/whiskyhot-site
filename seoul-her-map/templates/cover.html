<!doctype html><html lang="zh"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600&family=Noto+Sans+SC:wght@400;500&family=Cormorant+Garamond:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css"></head>
<body><div class="card">
  <div class="ai-label">{{ai_label}}</div>
  <div class="eyebrow">{{area_en}} · Seoul</div>
  <div style="height:36px"></div>
  <div class="h1">{{signature}}<br>{{area_zh}}{{category_zh}}<span style="color:var(--sage)"> {{count}}{{unit_zh}}</span></div>
  <div style="height:40px"></div>
  <div class="body">{{hook_zh}}</div>
  <div style="height:56px"></div>
  <div class="photo placeholder" style="height:760px; background-image:url('{{cover_image}}')"></div>
  <div class="grow"></div>
  <div class="foot">
    <div><div class="brand-zh">{{brand_zh}}</div><div class="brand">{{brand_en}}</div></div>
    <div class="small">{{date}}</div>
  </div>
  <img class="mascot" src="{{mascot}}" onerror="this.style.display='none'">
</div></body></html>
