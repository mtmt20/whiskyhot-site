<!doctype html><html lang="zh"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600&family=Noto+Sans+SC:wght@400;500&family=Cormorant+Garamond:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
.route { list-style:none; margin-top:40px }
.route li { display:flex; align-items:center; gap:34px; padding:30px 0; border-bottom:2px solid rgba(43,42,39,.12) }
.route .dot { width:74px; height:74px; border-radius:50%; background:var(--charcoal); color:var(--cream); font-family:var(--latin); font-size:38px; display:flex; align-items:center; justify-content:center; flex:none }
.route .nm { font-family:var(--serif); font-size:42px; font-weight:500 }
.route .mt { font-size:26px; color:var(--ink-soft); margin-top:4px }
.route .walk { margin-left:auto; font-family:var(--latin); font-size:30px; color:var(--sage); letter-spacing:.1em; white-space:nowrap }
</style></head>
<body><div class="card">
  <div class="ai-label">{{ai_label}}</div>
  <div class="eyebrow">Route · {{area_en}}</div>
  <div class="h2" style="margin-top:20px">{{area_zh}}半日动线</div>
  <div class="body" style="margin-top:16px">🚇 {{station_zh}} 出发 · 全程步行约 {{total_walk}} 分钟</div>
  <ol class="route">{{route_items}}</ol>
  <div class="grow"></div>
  <div class="small">保存这张，到了直接照着走。</div>
  <div class="foot"><div class="brand-zh">{{brand_zh}}</div><div class="brand">{{brand_en}}</div></div>
</div></body></html>
